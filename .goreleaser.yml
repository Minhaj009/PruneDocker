# GoReleaser configuration for PruneDocker
# Documentation: https://goreleaser.com

version: 2

project_name: prunedocker

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: prunedocker
    main: ./cmd/prunedocker
    binary: prunedocker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: binary-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - deploy/prunedocker.service
      - docker-compose.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
